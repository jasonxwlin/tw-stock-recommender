name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # Zero-tolerance: codebase is clean (10.00/10) as of the .pylintrc
      # added alongside this — any new message fails the check.
      - run: pylint tech_analysis.py fetchers.py conditions.py backtest_engine.py market_indicators.py report.py fundamentals.py news.py backtest_annual.py

  test:
    name: pytest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest  # pytest.ini already runs coverage and fails under 90%

  snyk:
    name: snyk security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: snyk/actions/setup@master
      # Open Source: known CVEs in requirements.txt's dependencies.
      # (Snyk Code/SAST dropped — not enabled on this org's plan; see
      # SNYK-CODE-0005 in Snyk's docs if that changes and this gets revisited.)
      - name: Snyk Open Source
        run: snyk test --severity-threshold=high --file=requirements.txt --package-manager=pip
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
