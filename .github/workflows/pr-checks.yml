name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # Zero-tolerance: codebase is clean (10.00/10) as of the .pylintrc
      # added alongside this — any new message fails the check.
      - run: pylint tech_analysis.py fundamentals.py news.py backtest_annual.py

  test:
    name: pytest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest  # pytest.ini already runs coverage and fails under 90%
